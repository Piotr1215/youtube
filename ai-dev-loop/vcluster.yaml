experimental:
  docker:
    nodes:
    - name: "worker-1"

privateNodes:
  enabled: true
  vpn:
    enabled: true
    nodeToNode:
      enabled: true

# The GPU half of the environment. The Stack waits for the curl-joined GPU node,
# loads the model there, then proves classif answers through it.
deploy:
  stacks:
  - name: classif
    displayName: classif on the GPU node
    parameters:
      gpuNode: vind-node
      model: winnow:12b-q4_K_M
    template:
      tasks:
      # Task names with outputs carry no hyphen: {{ .Outputs.task.name }} cannot address one.
      - name: model
        timeout: 30m0s
        app:
          template:
            spec:
              displayName: Model on the GPU node
              defaultNamespace: classif
              wait: true
              timeout: 25m
              config:
                manifests: |-
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: ollama
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: ollama
                    template:
                      metadata:
                        labels:
                          app: ollama
                      spec:
                        # Pending until the GPU node joins: this is the gate.
                        nodeSelector:
                          kubernetes.io/hostname: {{ .Values.gpuNode }}
                        initContainers:
                        - name: model-ready
                          image: curlimages/curl:8.22.0
                          env:
                          - name: HOST_IP
                            valueFrom:
                              fieldRef:
                                fieldPath: status.hostIP
                          - name: MODEL
                            value: {{ .Values.model | quote }}
                          command: ["sh", "-c"]
                          args:
                          - |
                            set -eu
                            api="http://$HOST_IP:11434/api"
                            until curl -sf "$api/version" >/dev/null; do echo "waiting for ollama on $HOST_IP"; sleep 5; done
                            curl -sf "$api/tags" | grep -q "\"$MODEL\"" || { echo "$MODEL is missing on the GPU host"; exit 1; }
                            curl -sf "$api/pull" -d '{"model":"embeddinggemma","stream":false}'
                            curl -sf "$api/generate" -d "{\"model\":\"$MODEL\",\"keep_alive\":\"1h\"}" >/dev/null
                            echo "$MODEL loaded on $HOST_IP"
                        # Ollama runs on the GPU host; this forwards the cluster to it.
                        containers:
                        - name: proxy
                          image: alpine/socat:1.8.1.3
                          env:
                          - name: HOST_IP
                            valueFrom:
                              fieldRef:
                                fieldPath: status.hostIP
                          args: ["tcp-listen:11434,fork,reuseaddr", "tcp:$(HOST_IP):11434"]
                          ports:
                          - containerPort: 11434
                          readinessProbe:
                            tcpSocket:
                              port: 11434
                  ---
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: ollama
                  spec:
                    type: LoadBalancer
                    selector:
                      app: ollama
                    ports:
                    - port: 11434
                      targetPort: 11434
        outputs:
        - name: endpoint
          fromResource:
            apiVersion: v1
            kind: Service
            namespace: classif
            name: ollama
            jsonPath: "{.status.loadBalancer.ingress[0].ip}"
        - name: clusterip
          fromResource:
            apiVersion: v1
            kind: Service
            namespace: classif
            name: ollama
            jsonPath: "{.spec.clusterIP}"
      # Healthy once classif scores a decision through the model task's endpoint.
      # Exit 0 or 1 is a scored answer; 2 means unreachable, 3 means no verdict.
      - name: check
        dependsOn: [model]
        timeout: 15m0s
        app:
          template:
            spec:
              displayName: classif answers
              defaultNamespace: classif
              wait: true
              timeout: 10m
              config:
                manifests: |-
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: classif-check
                    annotations:
                      helm.sh/hook: post-install,post-upgrade
                      helm.sh/hook-delete-policy: before-hook-creation
                  spec:
                    backoffLimit: 3
                    template:
                      spec:
                        restartPolicy: Never
                        containers:
                        - name: classif
                          image: python:3.12-alpine
                          env:
                          - name: CLASSIF_HOSTS
                            value: "{{ .Outputs.model.clusterip }}:11434={{ .Values.model }}"
                          command: ["sh", "-c"]
                          args:
                          - |
                            set -eu
                            wget -qO- https://github.com/Piotr1215/classif/archive/refs/heads/main.tar.gz | tar xz
                            rc=0
                            classif-main/classif "Is this about Kubernetes?" "The pod keeps crashlooping." || rc=$?
                            [ "$rc" -le 1 ]
      publishedOutputs:
      - name: endpoint
        fromTask:
          task: model
          output: endpoint
