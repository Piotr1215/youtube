id: bare-error-return
language: go
severity: warning
message: Wrap errors with context
rule:
  pattern: |
    if $ERR != nil {
      return $$$ARGS, $ERR
    }
  # direct-http-error-return owns the HTTP case, so one line gets one diagnostic
  not:
    follows:
      pattern: $RESP, $ERR := http.$METHOD($$$CALL)
