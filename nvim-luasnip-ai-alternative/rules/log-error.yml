id: log-error
language: go
severity: info
message: An error goes to slog.Error
# Every rule here matches the same structure, log.Printf with one plain verb
# (%v, %+v, %s or %d) and one argument, so syntax alone cannot say what the line
# is for. slog keeps the value but not printf formatting, so a %x or a width
# would be lost: those lines match no rule and stay as they are.
# This one needs no model: the argument is err, and syntax can see that.
rule:
  pattern: log.Printf($FMT, err)
  inside:
    kind: expression_statement
constraints:
  FMT:
    regex: '^"[^%]*%(\+v|[vsd])[^%]*"$'
transform:
  BARE:
    replace:
      source: $FMT
      replace: '\s*%[-+# 0-9.]*[a-zA-Z]'
      by: ''
  MSG:
    replace:
      source: $BARE
      replace: ':"$'
      by: '"'
fix: 'slog.Error($MSG, "err", err)'
