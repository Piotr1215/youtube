id: vague-error-message
language: go
severity: hint
message: Say which operation failed
metadata:
  ask: Does this error message tell a reader which operation failed?
  keep: "no"
rule:
  pattern: fmt.Errorf($MSG, $$$ARGS)
  inside:
    any:
      - kind: function_declaration
      - kind: method_declaration
    stopBy: end
    has:
      field: name
      pattern: $FN
constraints:
  MSG:
    regex: '^"'
transform:
  REST:
    substring:
      source: $MSG
      startChar: 1
fix: 'fmt.Errorf("$FN: $REST, $$$ARGS)'
