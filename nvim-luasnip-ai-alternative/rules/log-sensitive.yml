id: log-sensitive
language: go
severity: hint
message: Can print a secret or personal data
# Every rule here matches the same structure, log.Printf with one plain verb
# (%v, %+v, %s or %d) and one argument, so syntax alone cannot say what the line
# is for. slog keeps the value but not printf formatting, so a %x or a width
# would be lost: those lines match no rule and stay as they are.
# No fix: a person decides what this line may print. Its question is asked of
# every line apart from what the line is for, since a useful event can still
# print a secret; a yes keeps the line from every fix.
metadata:
  veto: >-
    Is the value this line logs a secret or personal data, such as a
    password, a token, an email address or a credentials record?
rule:
  pattern: log.Printf($FMT, $ARG)
  inside:
    kind: expression_statement
  not:
    pattern: log.Printf($FMT, err)
constraints:
  FMT:
    regex: '^"[^%]*%(\+v|[vsd])[^%]*"$'
