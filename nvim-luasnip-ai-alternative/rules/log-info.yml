id: log-info
language: go
severity: hint
message: An event? Move it to slog.Info
# Every rule here matches the same structure, log.Printf with one plain verb
# (%v, %+v, %s or %d) and one argument, so syntax alone cannot say what the line
# is for. slog keeps the value but not printf formatting, so a %x or a width
# would be lost: those lines match no rule and stay as they are.
metadata:
  choose: What is this log line for?
  option: >-
    info=an event someone operating the service wants in the logs, like
    startup, a sign-in, a request outcome or a duration
  min_p: 0.85
rule:
  pattern: log.Printf($FMT, $ARG)
  inside:
    kind: expression_statement
  not:
    pattern: log.Printf($FMT, err)
constraints:
  FMT:
    regex: '^"[^%]*%(\+v|[vsd])[^%]*"$'
transform:
  BARE:
    replace:
      source: $FMT
      replace: '\s*%[-+# 0-9.]*[a-zA-Z]'
      by: ''
  MSG:
    replace:
      source: $BARE
      replace: ':"$'
      by: '"'
fix: 'slog.Info($MSG, "$ARG", $ARG)'
