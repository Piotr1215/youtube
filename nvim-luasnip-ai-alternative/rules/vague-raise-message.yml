id: vague-raise-message
language: python
severity: hint
message: Say which operation failed
# The Python twin of vague-error-message: the fix prefixes a raised message
# with the enclosing function's name.
rule:
  pattern: $EXC($MSG)
  all:
    - inside:
        kind: raise_statement
    - inside:
        kind: function_definition
        stopBy: end
        has:
          field: name
          pattern: $FN
constraints:
  MSG:
    regex: '^"'
transform:
  REST:
    substring:
      source: $MSG
      startChar: 1
fix: '$EXC("$FN: $REST)'
