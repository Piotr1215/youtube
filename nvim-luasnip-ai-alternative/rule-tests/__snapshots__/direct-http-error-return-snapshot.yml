id: direct-http-error-return
snapshots:
  "func f() (*http.Response, error) {\n\tresp, err := http.Get(url)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn resp, nil\n}\n":
    fixed: |
      func f() (*http.Response, error) {
      	resp, err := http.Get(url)
      	if err != nil {
      		return nil, fmt.Errorf("f: %w", err)
      	}
      	return resp, nil
      }
