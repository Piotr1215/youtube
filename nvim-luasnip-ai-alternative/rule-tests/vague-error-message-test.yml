id: vague-error-message
valid:
  - 'func f() string { return fmt.Sprintf("bad status: %d", code) }'
  - 'func f() error { return fmt.Errorf(msg, code) }'
  - 'var errBad = fmt.Errorf("bad status: %d", code)'
invalid:
  - 'func fetchUser() error { return fmt.Errorf("bad status: %d", code) }'
  - 'func (c *Client) Get() error { return fmt.Errorf("bad status: %d", code) }'
